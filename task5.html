<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 5</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page stack">
    <div class="task-nav"><a class="back-link" href="./index.html">На главную</a></div>
    <section class="hero">
      <p class="eyebrow">Задание 5</p>
      <h1>Красные ячейки с четной суммой i и j</h1>
    </section>

    <section class="panel stack">
      <div class="button-row">
        <button class="action-button" id="paint-even">Подсветить таблицу</button>
      </div>
      <div class="table-wrap">
        <table id="indexed-table">
          <tbody>
            <tr><td>1:1</td><td>1:2</td><td>1:3</td><td>1:4</td><td>1:5</td><td>1:6</td><td>1:7</td><td>1:8</td><td>1:9</td></tr>
            <tr><td>2:1</td><td>2:2</td><td>2:3</td><td>2:4</td><td>2:5</td><td>2:6</td><td>2:7</td><td>2:8</td><td>2:9</td></tr>
            <tr><td>3:1</td><td>3:2</td><td>3:3</td><td>3:4</td><td>3:5</td><td>3:6</td><td>3:7</td><td>3:8</td><td>3:9</td></tr>
            <tr><td>4:1</td><td>4:2</td><td>4:3</td><td>4:4</td><td>4:5</td><td>4:6</td><td>4:7</td><td>4:8</td><td>4:9</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('paint-even').addEventListener('click', () => {
      const rows = document.querySelectorAll('#indexed-table tr');
      rows.forEach((row, rowIndex) => {
        row.querySelectorAll('td').forEach((cell, colIndex) => {
          const i = rowIndex + 1;
          const j = colIndex + 1;
          if ((i + j) % 2 === 0) {
            cell.style.color = '#8a1111';
            cell.style.backgroundColor = '#f3b1b1';
          }
        });
      });
    });
  </script>
</body>
</html>
