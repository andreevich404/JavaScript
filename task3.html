<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 3 — Таблица людей</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <a class="back-link" href="./index.html">← На главную</a>
    </div>

    <!-- Легенда возрастов -->
    <div class="panel" style="padding: 16px 24px;">
      <div class="legend">
        <span><span class="legend-dot" style="background:var(--success)"></span>До 18 лет</span>
        <span><span class="legend-dot" style="background:var(--warning)"></span>18–60 лет</span>
        <span><span class="legend-dot" style="background:var(--danger)"></span>Старше 60 лет</span>
      </div>
    </div>

    <!-- Панель управления -->
    <div class="panel" style="gap: 12px;">
      <div class="toolbar" style="flex-wrap: wrap; gap: 10px;">
        <button class="action-button" id="load-btn">⬇ Загрузить</button>
        <button class="action-button" id="add-btn" disabled>+ Добавить</button>
        <button class="action-button action-button--danger" id="delete-selected-btn" hidden>
          🗑 Удалить выбранные
        </button>
        <div style="flex:1"></div>
        <div class="filter-group">
          <span style="font-size:13px; color:var(--muted); font-weight:600;">Пол:</span>
          <button class="filter-btn active" data-filter="all">Все</button>
          <button class="filter-btn" data-filter="male">Мужчины</button>
          <button class="filter-btn" data-filter="female">Женщины</button>
        </div>
      </div>
    </div>

    <!-- Контейнер таблицы -->
    <div id="table-container" class="panel">
      <div class="empty-state">Нажмите «Загрузить» для получения данных</div>
    </div>
  </main>

  <!-- Модальное окно добавления / редактирования -->
  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal-box" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modal-title">Добавить запись</h3>
        <button class="modal-close" id="modal-close" aria-label="Закрыть">✕</button>
      </div>
      <form id="human-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="f-firstName">Имя</label>
            <input type="text" id="f-firstName" placeholder="Иван" required>
          </div>
          <div class="field">
            <label for="f-lastName">Фамилия</label>
            <input type="text" id="f-lastName" placeholder="Иванов" required>
          </div>
          <div class="field">
            <label for="f-age">Возраст</label>
            <input type="number" id="f-age" min="0" max="130" placeholder="25" required>
          </div>
          <div class="field">
            <label for="f-gender">Пол</label>
            <select id="f-gender" required>
              <option value="male">Мужской</option>
              <option value="female">Женский</option>
            </select>
          </div>
          <div class="field field-full">
            <label for="f-address">Адрес</label>
            <input type="text" id="f-address" placeholder="ул. Пушкина, 10, Москва" required>
          </div>
          <div class="field field-full">
            <label for="f-phone">Телефон</label>
            <input type="text" id="f-phone" placeholder="+7 (999) 123-45-67" required>
          </div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
          <button type="button" class="action-button action-button--ghost" id="modal-cancel">Отмена</button>
          <button type="submit" class="action-button" id="modal-submit">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./task3.js"></script>
</body>
</html>
