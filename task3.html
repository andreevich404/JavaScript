<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 3</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page stack">
    <div class="task-nav"><a class="back-link" href="./index.html">На главную</a></div>
    <section class="hero">
      <p class="eyebrow">Задание 3</p>
      <h1>Получение элементов страницы</h1>
    </section>

    <section class="panel stack">
      <div id="users-title">Пользователи:</div>
      <ul id="users-list">
        <li>Джон</li>
        <li>Пит</li>
      </ul>
      <div class="button-row">
        <button class="action-button" id="run-selectors">Показать найденные элементы</button>
      </div>
      <div class="result-box" id="selectors-output">Нажмите кнопку, чтобы увидеть результат.</div>
    </section>
  </main>

  <script>
    document.getElementById('run-selectors').addEventListener('click', () => {
      const div = document.querySelector('div#users-title');
      const ul = document.querySelector('ul#users-list');
      const secondLi = ul.querySelectorAll('li')[1];

      document.getElementById('selectors-output').textContent =
        `div: ${div.textContent}\n` +
        `ul: ${ul.tagName}\n` +
        `второй li: ${secondLi.textContent}`;
    });
  </script>
</body>
</html>
