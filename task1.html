<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 1 — Факты о животных</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <a class="back-link" href="./index.html">← На главную</a>
    </div>

    <!-- Экран 1: Приветствие с именем -->
    <div id="screen-welcome" class="panel welcome-panel">
      <div class="welcome-content">
        <p id="welcome-title" class="welcome-screen-title">
          <span class="spinner"></span> Загрузка...
        </p>
        <p id="welcome-name" class="welcome-name-highlight" hidden></p>
        <div class="welcome-buttons" id="welcome-buttons" hidden>
          <button class="action-button" id="btn-accept">Ладно...</button>
          <button class="action-button action-button--ghost" id="btn-retry">А может не надо?..</button>
        </div>
      </div>
    </div>

    <!-- Экран 2: Выбор животного -->
    <div id="screen-animals" class="panel welcome-panel" hidden>
      <div class="welcome-content">
        <p class="welcome-screen-title" style="font-size: clamp(22px, 3.5vw, 30px); font-weight: 700;">
          На чьей ты стороне?
        </p>
        <div class="animal-list">
          <button class="animal-btn" data-animal="cat">🐱 &nbsp;Коты</button>
          <button class="animal-btn" data-animal="dog">🐶 &nbsp;Собаки</button>
          <button class="animal-btn" data-animal="fox">🦊 &nbsp;Лисы (???)</button>
        </div>
      </div>
    </div>

    <!-- Экран 3: Факт и картинка -->
    <div id="screen-fact" class="panel" hidden>
      <div id="fact-content">
        <div class="empty-state">
          <span class="spinner"></span> Загрузка...
        </div>
      </div>
      <div class="fact-buttons">
        <button class="action-button" id="btn-new-fact">↺ &nbsp;Ещё факт</button>
        <button class="action-button action-button--ghost" id="btn-back-animals">← &nbsp;Назад</button>
      </div>
    </div>
  </main>

  <script src="./task1.js"></script>
</body>
</html>
