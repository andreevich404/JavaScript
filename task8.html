<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 8</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page stack">
    <div class="task-nav"><a class="back-link" href="./index.html">На главную</a></div>
    <section class="hero">
      <p class="eyebrow">Задание 8</p>
      <h1>Интерфейс создания списка</h1>
    </section>

    <section class="panel stack">
      <div class="button-row">
        <button class="action-button" id="create-list">Создать список через prompt</button>
      </div>
      <ul id="dynamic-list"></ul>
    </section>
  </main>

  <script>
    document.getElementById('create-list').addEventListener('click', () => {
      const list = document.getElementById('dynamic-list');
      list.innerHTML = '';

      const count = Number(prompt('Сколько пунктов добавить?'));
      if (!Number.isInteger(count) || count < 0) {
        alert('Нужно ввести целое число 0 или больше.');
        return;
      }

      for (let i = 0; i < count; i++) {
        const text = prompt(`Введите текст пункта ${i + 1}`);
        if (text === null) {
          break;
        }

        const li = document.createElement('li');
        li.textContent = text;
        list.append(li);
      }
    });
  </script>
</body>
</html>
