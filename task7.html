<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 7</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <div class="toolbar"><a class="back-link" href="./index.html">На главную</a></div>
    <section class="hero">
      <p class="eyebrow">Задание 7</p>
      <h1>Изменение горизонтальной линии</h1>
    </section>
    <section class="panel line-demo">
      <div class="line-stage">
        <div class="line-wrap" id="line-wrap">
          <hr id="demo-line">
        </div>
      </div>
      <div class="range-grid">
        <label>Ширина
          <input id="line-width" type="range" min="60" max="560" value="260">
        </label>
        <label>Толщина
          <input id="line-height" type="range" min="2" max="24" value="6">
        </label>
        <label>Смещение по горизонтали
          <input id="line-offset" type="range" min="0" max="300" value="40">
        </label>
        <label>Цвет
          <input id="line-color" type="color" value="#38bdf8">
        </label>
      </div>
    </section>
  </main>
  <script>
    const line = document.getElementById('demo-line');
    const widthInput = document.getElementById('line-width');
    const heightInput = document.getElementById('line-height');
    const offsetInput = document.getElementById('line-offset');
    const colorInput = document.getElementById('line-color');

    function updateLine() {
      line.style.width = `${widthInput.value}px`;
      line.style.height = `${heightInput.value}px`;
      line.style.marginLeft = `${offsetInput.value}px`;
      line.style.backgroundColor = colorInput.value;
    }

    [widthInput, heightInput, offsetInput, colorInput].forEach(control => {
      control.addEventListener('input', updateLine);
    });

    updateLine();
  </script>
</body>
</html>
